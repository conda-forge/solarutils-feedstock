schema_version: 1

context:
  version: "0.4.8"

package:
  name: solarutils
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/solarutils/solarutils-${{ version }}.tar.gz
  sha256: f2ad9fe2e284c51a8378bcb12f94d0cb2d55c91f28529bf0d70853ca49152a1c

build:
  number: 0
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
  host:
    - python
    - setuptools
    - pip
  run:
    - python

tests:
  - python:
      imports:
        - solar_utils
      pip_check: true

about:
  summary: Python wrappers around NREL SOLPOS and SPECTRL2
  license: BSD-3-Clause AND LicenseRef-NREL
  license_file:
    - LICENSE
    - solar_utils/NREL_DISCLAIMERS-COPYRIGHTS-LICENSES.txt
  homepage: https://github.com/mikofski/SolarUtils
  documentation: https://mikofski.github.io/SolarUtils/

extra:
  recipe-maintainers:
    - mikofski
